<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/icons/orca.svg" type="image/svg+xml"><title>Orca Staff Portal</title><style>:root{--bg:#050914;--panel:#0b1426;--blue:#20a8ff;--muted:#9caac0}body{margin:0;background:radial-gradient(circle at 20% 0,#12305a,#050914 45%);color:#f5f8ff;font-family:system-ui;padding:24px}.box{max-width:650px;margin:20px auto;background:var(--panel);border:1px solid #ffffff18;border-radius:22px;padding:24px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:11px;border:1px solid #ffffff20;background:#07111f;color:#fff;font:inherit}button{background:linear-gradient(90deg,var(--blue),#426eff);border:0;font-weight:800;cursor:pointer}.muted{color:var(--muted)}.ok{color:#8ff0ad}.error{color:#ff9b9b}.hidden{display:none}.tabs{display:flex;gap:8px}.tabs button{width:auto}.card{padding:16px;background:#07111f;border-radius:14px;margin-top:14px}</style></head><body><div class="box" id="portal"><h1>ORCA ENTERPRISE</h1><p class="muted">Staff Registration & Daily Work Check-In</p><div class="tabs"><button onclick="showTab('login')">Staff Login</button><button onclick="showTab('register')">Register</button></div><section id="login"><h2>Daily Login</h2><input id="lid" placeholder="Employee ID"><input id="lpw" type="password" placeholder="Password"><button onclick="login()">Login & Check In</button></section><section id="register" class="hidden"><h2>Staff Registration</h2><input id="name" placeholder="Full name"><input id="phone" placeholder="Phone"><input id="email" type="email" placeholder="Email"><input id="eid" placeholder="Employee ID"><input id="rpw" type="password" placeholder="Password (12+ characters)"><button onclick="registerStaff()">Submit Registration</button><p class="muted">Registration must be approved by the creator before you can check in.</p></section><div id="status"></div></div><div id="dash" class="box hidden"><h2>Staff Dashboard</h2><div id="welcome"></div><div class="card" id="checkin"></div><button onclick="checkIn()">Check In Today</button><button onclick="logout()">Sign Out</button></div><script>let token=localStorage.getItem("orcaStaffToken")||"";function showTab(id){document.getElementById("login").classList.toggle("hidden",id!=="login");document.getElementById("register").classList.toggle("hidden",id!=="register")}async function registerStaff(){const r=await fetch("/api/staff/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName:document.getElementById("name").value,phone:document.getElementById("phone").value,email:document.getElementById("email").value,employeeId:document.getElementById("eid").value,password:document.getElementById("rpw").value})});const d=await r.json();const s=document.getElementById("status");s.className=r.ok?"ok":"error";s.textContent=d.message||d.error}async function login(){const r=await fetch("/api/staff/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({employeeId:document.getElementById("lid").value,password:document.getElementById("lpw").value})});const d=await r.json();if(!r.ok){status.className="error";status.textContent=d.error;return}token=d.token;localStorage.setItem("orcaStaffToken",token);loadMe()}async function loadMe(){const r=await fetch("/api/staff/me",{headers:{Authorization:"Bearer "+token}});if(!r.ok){logout();return}const d=await r.json();document.getElementById("portal").classList.add("hidden");document.getElementById("dash").classList.remove("hidden");document.getElementById("welcome").textContent="Welcome, "+d.full_name+" ("+d.employee_id+")";document.getElementById("checkin").textContent=d.checked_in_at?"Checked in today at "+new Date(d.checked_in_at).toLocaleString():"Not checked in today."}async function checkIn(){const r=await fetch("/api/staff/check-in",{method:"POST",headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok){alert(d.error);return}document.getElementById("checkin").textContent="Checked in today at "+new Date(d.checkedInAt).toLocaleString()}function logout(){localStorage.removeItem("orcaStaffToken");token="";location.reload()}if(token)loadMe();</script></body></html>

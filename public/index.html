<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orca Enterprise</title><style>
:root{--bg:#050914;--panel:#0b1426;--blue:#20a8ff;--gold:#e8c45a;--text:#f5f8ff;--muted:#9caac0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#12305a 0,#050914 45%);color:var(--text)}header{padding:22px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff16}.brand{font-weight:900;letter-spacing:.14em}.brand span{color:var(--gold)}main{max-width:1100px;margin:auto;padding:60px 24px}.hero{padding:42px 0}.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.18em}.hero h1{font-size:clamp(42px,8vw,78px);line-height:.95;margin:14px 0}.hero p{color:var(--muted);font-size:18px;max-width:680px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{background:linear-gradient(145deg,#10213b,#09111f);border:1px solid #ffffff15;border-radius:22px;padding:24px;box-shadow:0 15px 45px #0005}.card h3{margin-top:0}.card p{color:var(--muted);line-height:1.5}.btn{display:inline-block;background:linear-gradient(90deg,var(--blue),#426eff);color:white;padding:13px 20px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:12px}.free{color:var(--gold);font-weight:800}.footer{color:var(--muted);padding:40px 0}</style></head><body><header><div class="brand">ORCA <span>ENTERPRISE</span></div><div class="free">FREE APP</div></header><main><section class="hero"><div class="eyebrow">ONE APP • TOTAL SOLUTIONS</div><h1>Cleaner.<br>Brighter.<br>Better Living.</h1><p>Professional mobile detailing, residential cleaning, commercial cleaning and transportation services in one convenient platform.</p><a class="btn" href="#services">Explore Services →</a></section><section id="services"><div class="grid" id="cards"></div></section><div class="footer">Orca Enterprise • Montego Bay, Jamaica • © 2026</div></main><script>
fetch("/api/services").then(r=>r.json()).then(items=>{document.getElementById("cards").innerHTML=items.map(s=>'<article class="card"><h3>'+s.name+'</h3><p>'+s.description+'</p>'+(s.items?'<p>• '+s.items.join('<br>• ')+'</p>':'')+'<a class="btn" href="mailto:orcaenterprise815@gmail.com?subject=Orca Enterprise Booking - '+encodeURIComponent(s.name)+'">Book Service</a></article>').join("")});
</script></body></html>

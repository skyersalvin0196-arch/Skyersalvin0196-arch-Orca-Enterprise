<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orca Admin</title><style>body{margin:0;background:#050914;color:#f5f8ff;font-family:system-ui;padding:24px}main{max-width:1100px;margin:auto}.box{background:#0b1426;border:1px solid #ffffff18;border-radius:18px;padding:22px;margin-bottom:18px}input,select,button{padding:11px;border-radius:9px;border:1px solid #ffffff20;background:#07111f;color:#fff;font:inherit}button{background:#20a8ff;border:0;cursor:pointer;font-weight:700}.danger{background:#b83a4b}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ffffff14}th{color:#e8c45a}.muted{color:#9caac0}.error{color:#ff9b9b}.ok{color:#8ff0ad}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}</style></head><body><main><div class="top"><div><h1>Orca Enterprise Admin</h1><div class="muted">Secure customer bookings & staff access</div></div><button onclick="logout()">Sign Out</button></div><div id="login" class="box"><h2>Admin Login</h2><div class="grid"><input id="user" autocomplete="username" placeholder="Username"><input id="pw" type="password" autocomplete="current-password" placeholder="Password"></div><br><button onclick="login()">Sign In</button><p id="msg" class="error"></p></div><div id="dash" style="display:none"><div class="box"><div class="top"><strong id="count">0 bookings</strong><button onclick="loadBookings()">Refresh</button></div></div><div class="box table"><table><thead><tr><th>Date</th><th>Customer</th><th>Phone</th><th>Service</th><th>Preferred Time</th><th>Location</th><th>Status</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table></div><div id="ownerPanel" class="box" style="display:none"><h2>Staff Accounts</h2><p class="muted">Owner-only account management. New passwords are never displayed after creation.</p><div class="grid"><input id="newUser" placeholder="New username"><input id="newPw" type="password" placeholder="New password (12+ chars)"><select id="newRole"><option value="staff">Staff</option><option value="owner">Owner</option></select><button onclick="addUser()">Add Account</button></div><p id="userMsg"></p><div class="table"><table><thead><tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr></thead><tbody id="users"></tbody></table></div></div></div></main><script>
let token=localStorage.getItem("orcaAdminToken")||"";
const headers=()=>({Authorization:"Bearer "+token});
async function login(){const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("user").value,password:document.getElementById("pw").value})});const d=await r.json();if(!r.ok){document.getElementById("msg").textContent=d.error;return}token=d.token;localStorage.setItem("orcaAdminToken",token);showDash(d.user);loadBookings()}
function showDash(u){document.getElementById("login").style.display="none";document.getElementById("dash").style.display="block";if(u?.role==="owner"||sessionStorage.getItem("orcaOwner")==="1"){document.getElementById("ownerPanel").style.display="block";loadUsers()}}
async function loadBookings(){if(!token)return;const r=await fetch("/api/bookings",{headers:headers()});if(r.status===401){logout(false);return}const d=await r.json();if(!r.ok){alert(d.error);return}document.getElementById("count").textContent=d.length+" booking"+(d.length===1?"":"s");document.getElementById("rows").innerHTML=d.map(b=>'<tr><td>'+new Date(b.created_at).toLocaleString()+'</td><td>'+esc(b.customer_name)+'<br><span class="muted">'+esc(b.email||"")+'</span></td><td>'+esc(b.phone)+'</td><td>'+esc(b.service)+'</td><td>'+esc(b.scheduled_at||"—")+'</td><td>'+esc(b.address||"—")+'</td><td><select onchange="status('+b.id+',this.value)"><option '+sel(b.status,"New")+'>New</option><option '+sel(b.status,"Confirmed")+'>Confirmed</option><option '+sel(b.status,"Completed")+'>Completed</option><option '+sel(b.status,"Cancelled")+'>Cancelled</option></select></td><td>'+esc(b.notes||"—")+'</td></tr>').join("")}
async function loadUsers(){const r=await fetch("/api/admin/users",{headers:headers()});if(!r.ok)return;const d=await r.json();document.getElementById("users").innerHTML=d.map(u=>'<tr><td>'+esc(u.username)+'</td><td>'+esc(u.role)+'</td><td>'+new Date(u.created_at).toLocaleString()+'</td><td><button class="danger" onclick="deleteUser('+u.id+')">Delete</button></td></tr>').join("")}
async function addUser(){const msg=document.getElementById("userMsg");const r=await fetch("/api/admin/users",{method:"POST",headers:{"Content-Type":"application/json",...headers()},body:JSON.stringify({username:document.getElementById("newUser").value,password:document.getElementById("newPw").value,role:document.getElementById("newRole").value})});const d=await r.json();msg.className=r.ok?"ok":"error";msg.textContent=r.ok?"Account created.":d.error;if(r.ok){document.getElementById("newUser").value="";document.getElementById("newPw").value="";loadUsers()}}
async function deleteUser(id){if(!confirm("Delete this account?"))return;const r=await fetch("/api/admin/users/"+id,{method:"DELETE",headers:headers()});if(!r.ok){const d=await r.json();alert(d.error);return}loadUsers()}
async function status(id,status){const r=await fetch("/api/bookings/"+id,{method:"PATCH",headers:{"Content-Type":"application/json",...headers()},body:JSON.stringify({status})});if(!r.ok)alert("Could not update status")}
async function logout(call=true){if(call&&token)await fetch("/api/admin/logout",{method:"POST",headers:headers()}).catch(()=>{});localStorage.removeItem("orcaAdminToken");sessionStorage.removeItem("orcaOwner");token="";location.reload()}
function sel(a,b){return a===b?"selected":""}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
async function init(){if(!token)return;const r=await fetch("/api/admin/me",{headers:headers()});if(!r.ok){logout(false);return}const u=await r.json();if(u.role==="owner")sessionStorage.setItem("orcaOwner","1");showDash(u);loadBookings()}init();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orca Admin</title><style>body{margin:0;background:#050914;color:#f5f8ff;font-family:system-ui;padding:24px}main{max-width:1100px;margin:auto}.box{background:#0b1426;border:1px solid #ffffff18;border-radius:18px;padding:22px;margin-bottom:18px}input,select,button{padding:11px;border-radius:9px;border:1px solid #ffffff20;background:#07111f;color:#fff;font:inherit}button{background:#20a8ff;border:0;cursor:pointer;font-weight:700}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ffffff14}th{color:#e8c45a}.muted{color:#9caac0}.error{color:#ff9b9b}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body><main><div class="top"><div><h1>Orca Enterprise Admin</h1><div class="muted">Customer bookings dashboard</div></div><button onclick="loadBookings()">Refresh</button></div><div id="login" class="box"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Sign In</button><p id="msg" class="error"></p></div><div id="dash" style="display:none"><div class="box"><strong id="count">0 bookings</strong></div><div class="box table"><table><thead><tr><th>Date</th><th>Customer</th><th>Phone</th><th>Service</th><th>Preferred Time</th><th>Location</th><th>Status</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
let token=localStorage.getItem("orcaAdminToken")||"";
async function login(){const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("pw").value})});const d=await r.json();if(!r.ok){document.getElementById("msg").textContent=d.error;return}token=d.token;localStorage.setItem("orcaAdminToken",token);showDash();loadBookings()}
function showDash(){document.getElementById("login").style.display="none";document.getElementById("dash").style.display="block"}
async function loadBookings(){if(!token)return;const r=await fetch("/api/bookings",{headers:{Authorization:"Bearer "+token}});if(r.status===401){localStorage.removeItem("orcaAdminToken");token="";location.reload();return}const d=await r.json();if(!r.ok){alert(d.error);return}showDash();document.getElementById("count").textContent=d.length+" booking"+(d.length===1?"":"s");document.getElementById("rows").innerHTML=d.map(b=>'<tr><td>'+new Date(b.created_at).toLocaleString()+'</td><td>'+esc(b.customer_name)+'<br><span class="muted">'+esc(b.email||"")+'</span></td><td>'+esc(b.phone)+'</td><td>'+esc(b.service)+'</td><td>'+esc(b.scheduled_at||"—")+'</td><td>'+esc(b.address||"—")+'</td><td><select onchange="status('+b.id+',this.value)"><option '+sel(b.status,"New")+'>New</option><option '+sel(b.status,"Confirmed")+'>Confirmed</option><option '+sel(b.status,"Completed")+'>Completed</option><option '+sel(b.status,"Cancelled")+'>Cancelled</option></select></td><td>'+esc(b.notes||"—")+'</td></tr>').join("")}
function sel(a,b){return a===b?"selected":""}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
async function status(id,status){const r=await fetch("/api/bookings/"+id,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({status})});if(!r.ok)alert("Could not update status")}
if(token)showDash();if(token)loadBookings();
</script></body></html>
